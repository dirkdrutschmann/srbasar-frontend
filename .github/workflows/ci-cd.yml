name: Frontend CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: srbasar-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  DEPLOY_HOST: mail.clubcircle.de
  DEPLOY_PORT: '22'
  DEPLOY_USER: root
  FRONTEND_ROOT: /var/www/clients/client2/web3/web/.srbasar/frontend
  FRONTEND_INCOMING: /var/www/clients/client2/web3/web/.srbasar/incoming/frontend

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

  deploy:
    name: Deploy release tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(node -p "require('./package.json').version")"
          [[ "$package_version" == "$version" ]] || {
            echo "Tag $version does not match package.json version $package_version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload source archive
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="$FRONTEND_INCOMING/srbasar-frontend-${VERSION}.tar.gz"
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$FRONTEND_INCOMING'"
          git archive --format=tar.gz --prefix=source/ "$GITHUB_SHA" | \
            ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "tmp='$archive.tmp.$$'; cat > \"\$tmp\"; mv -f \"\$tmp\" '$archive'"

      - name: Activate release
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="$FRONTEND_INCOMING/srbasar-frontend-${VERSION}.tar.gz"
          staging="$FRONTEND_ROOT/.incoming-${VERSION}-$$"
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; mkdir -p '$staging'; tar --extract --gzip --file '$archive' --directory '$staging' --strip-components=1 --no-same-owner --no-same-permissions; bash '$staging/ops/deploy.sh' '$VERSION' '$staging'; rm -rf -- '$staging' '$archive'"
